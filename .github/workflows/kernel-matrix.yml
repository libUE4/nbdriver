name: Android kernel KMI build matrix

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      kmi:
        description: '单个 KMI；留空或 all 编译全部'
        required: false
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  abi-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check SDK syntax
        run: |
          set -euo pipefail
          cc -D_GNU_SOURCE -std=c11 -Wall -Wextra -Werror \
            -Iinclude -Isdk/include -fsyntax-only sdk/src/client.c

      - name: Check shared ABI
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -Iinclude \
            tests/abi_header_check.c -o /tmp/nbdriver-abi-header-check
          /tmp/nbdriver-abi-header-check

      - name: Check synthetic page-table walker
        run: |
          set -euo pipefail
          python3 tests/test_walk.py
          python3 tests/test_read_permissions.py
          python3 tests/test_audit_fixes.py
          python3 tests/test_devpts_auto.py

      - name: Check standalone SDK and process/batch helpers
        run: |
          set -euo pipefail
          python3 tests/test_single_header.py
          python3 tests/test_single_header.py --legacy
          python3 tests/test_readv.py
          python3 tests/test_metadata.py
          python3 tests/test_thread_signal.py
          python3 tests/test_mapping.py
          cc -std=c11 -Wall -Wextra -Werror -Iinclude -Isdk/include \
            tests/devpts_host_check.c -Wl,--wrap=ioctl -o /tmp/nbdriver-devpts-sdk
          /tmp/nbdriver-devpts-sdk
          cc -std=c11 -Wall -Wextra -Werror -D_GNU_SOURCE -Isdk/include \
            tests/devpts_filter_smoke.c -o /tmp/nbdriver-devpts-probe
          cc -std=c11 -Wall -Wextra -Werror -Iinclude -Isrc \
            tests/query_rules_check.c -o /tmp/nbdriver-query-rules
          /tmp/nbdriver-query-rules
          cc -std=c11 -Wall -Wextra -Werror -Isdk/include \
            tests/query_sdk_check.c -Wl,--wrap=ioctl -o /tmp/nbdriver-query-sdk
          /tmp/nbdriver-query-sdk
          cc -std=c11 -Wall -Wextra -Werror -pthread -Isdk/include \
            tests/device_query_readv_smoke.c -o /tmp/nbdriver-query-probe
          cc -std=c11 -Wall -Wextra -Werror -Isdk/include \
            tests/metadata_sdk_check.c -Wl,--wrap=ioctl -o /tmp/nbdriver-metadata-sdk
          /tmp/nbdriver-metadata-sdk
          cc -std=c11 -Wall -Wextra -Werror -Isdk/include \
            tests/device_metadata_smoke.c -o /tmp/nbdriver-metadata-probe

      - name: Check query authorization and UDP capture
        run: |
          set -euo pipefail
          python3 tests/test_query_authorization.py
          python3 tests/test_udp_capture.py
          python3 tests/test_udp_sdk.py

      - name: Check device smoke programs
        run: |
          set -euo pipefail
          cc -D_GNU_SOURCE -std=c11 -Wall -Wextra -Werror -pthread \
            -Iinclude -Isdk/include -fsyntax-only \
            tests/device_read_smoke.c tests/device_write_smoke.c tests/device_ioctl_smoke.c tests/device_connection_smoke.c
          cc -D_GNU_SOURCE -std=c11 -O2 -Wall -Wextra -Werror -pthread \
            -Iinclude -Isdk/include tests/nbdriver_smoke.c sdk/src/client.c \
            -o /tmp/nbdriver-smoke

  kernel:
    needs: abi-check
    name: Build ${{ matrix.kmi }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kmi: ${{ fromJSON((inputs.kmi == '' || inputs.kmi == 'all') && '["android12-5.10","android13-5.10","android13-5.15","android14-5.15","android14-6.1","android15-6.6","android16-6.12","android17-6.18"]' || format('["{0}"]', inputs.kmi)) }}
    defaults:
      run:
        shell: bash
    env:
      KMI: ${{ matrix.kmi }}
    steps:
      - name: Free runner disk before pulling DDK
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android \
            /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build ARM64 module
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/work" \
            --workdir /work \
            --env KMI --env GITHUB_SHA \
            --env "DDK_IMAGE_REFERENCE=ghcr.io/ylarod/ddk:${KMI}-20260828" \
            "ghcr.io/ylarod/ddk:${KMI}-20260828" -euc '
              make -j"$(nproc)" KDIR="${KERNEL_SRC:?KERNEL_SRC is not set}" \
                ARCH=arm64 LLVM=1 LLVM_IAS=1
              python3 tools/ddk_symbol_audit.py --kdir "$KERNEL_SRC" \
                --module src/nbdriver.ko --output "out/ddk-symbols-${KMI}.json"
              # .ko 允许带未定义符号链接成功，真正失败在 insmod。
              # 若导入的符号不在 Module.symvers 里，当场失败，不把“编过”当成“能加载”。
              python3 tools/check_undefined.py \
                --symvers "$KERNEL_SRC/Module.symvers" \
                --module src/nbdriver.ko \
                --kmi "$KMI"
              python3 tools/check_callback_tail.py --module src/nbdriver.ko
            '
          sudo chown -R -- "$(id -u):$(id -g)" src out
          test -s src/nbdriver.ko
      - name: Prepare module and hash
        run: |
          set -euo pipefail
          mkdir -p out
          cp src/nbdriver.ko "out/nbdriver-${KMI}.ko"
          sha256sum "out/nbdriver-${KMI}.ko" > "out/nbdriver-${KMI}.ko.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: nbdriver-${{ matrix.kmi }}
          path: |
            out/nbdriver-${{ matrix.kmi }}.ko
            out/nbdriver-${{ matrix.kmi }}.ko.sha256
            out/ddk-symbols-${{ matrix.kmi }}.json
          if-no-files-found: error
          retention-days: 30
