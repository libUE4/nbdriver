name: Android kernel KMI build matrix

on:
  workflow_dispatch:
    inputs:
      kmi:
        description: '单个 KMI；留空或 all 编译全部'
        required: false
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  abi-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check SDK syntax
        run: |
          set -euo pipefail
          cc -D_GNU_SOURCE -std=c11 -Wall -Wextra -Werror \
            -Isdk/include -fsyntax-only sdk/src/client.c

      - name: Check shared ABI and standalone SDK headers
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -Isdk/include \
            -include nbdriver_abi.h -x c -fsyntax-only /dev/null
          cc -std=c11 -Wall -Wextra -Werror -Isdk/include \
            -include nbdriver.h -x c -fsyntax-only /dev/null
          c++ -std=c++17 -Wall -Wextra -Werror -Isdk/include \
            -include nbdriver.h -x c++ -fsyntax-only /dev/null

      - name: Check loader build
        run: make loader SMOKE_CC=cc

      - name: Check loader build with Clang
        run: make loader SMOKE_CC=clang LOADER_OUTPUT=out/nbdriver-loader-clang


  kernel:
    needs: abi-check
    name: Build ${{ matrix.kmi }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kmi: ${{ fromJSON((inputs.kmi == '' || inputs.kmi == 'all') && '["android12-5.10","android13-5.10","android13-5.15","android14-5.15","android14-6.1","android15-6.6","android16-6.12","android17-6.18"]' || format('["{0}"]', inputs.kmi)) }}
    defaults:
      run:
        shell: bash
    env:
      KMI: ${{ matrix.kmi }}
    steps:
      - name: Free runner disk before pulling DDK
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android \
            /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build ARM64 module
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/work" \
            --workdir /work \
            --env KMI --env GITHUB_SHA \
            --env "DDK_IMAGE_REFERENCE=ghcr.io/ylarod/ddk:${KMI}-20260828" \
            "ghcr.io/ylarod/ddk:${KMI}-20260828" -euc '
              make -j"$(nproc)" KDIR="${KERNEL_SRC:?KERNEL_SRC is not set}" \
                ARCH=arm64 LLVM=1 LLVM_IAS=1
              python3 tools/ddk_symbol_audit.py --kdir "$KERNEL_SRC" \
                --module src/nbdriver.ko --output "out/ddk-symbols-${KMI}.json"
              # .ko 允许带未定义符号链接成功，真正失败在 insmod。
              # 若导入的符号不在 Module.symvers 里，当场失败，不把“编过”当成“能加载”。
              python3 tools/check_undefined.py \
                --symvers "$KERNEL_SRC/Module.symvers" \
                --module src/nbdriver.ko \
                --kmi "$KMI"
              python3 tools/check_percpu.py --module src/nbdriver.ko
              python3 tools/check_callback_tail.py --module src/nbdriver.ko
              python3 tools/check_cfi_boundaries.py --module src/nbdriver.ko \
                --output "out/cfi-boundaries-${KMI}.json"
            '
          sudo chown -R -- "$(id -u):$(id -g)" src out
          test -s src/nbdriver.ko
      - name: Prepare module and hash
        run: |
          set -euo pipefail
          mkdir -p out
          cp src/nbdriver.ko "out/nbdriver-${KMI}.ko"
          sha256sum "out/nbdriver-${KMI}.ko" > "out/nbdriver-${KMI}.ko.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: nbdriver-${{ matrix.kmi }}
          path: |
            out/nbdriver-${{ matrix.kmi }}.ko
            out/nbdriver-${{ matrix.kmi }}.ko.sha256
            out/ddk-symbols-${{ matrix.kmi }}.json
            out/cfi-boundaries-${{ matrix.kmi }}.json
          if-no-files-found: error
          retention-days: 30
